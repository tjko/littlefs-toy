name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            binary: lfst
          - target: windows
            binary: lfst.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mingw-w64
        if: matrix.target == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Configure
        run: |
          if [ "${{ matrix.target }}" = "windows" ]; then
            cmake -S . -B build-${{ matrix.target }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw64.cmake
          else
            cmake -S . -B build-${{ matrix.target }} -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build-${{ matrix.target }} --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfst-${{ matrix.target }}
          path: build-${{ matrix.target }}/**/${{ matrix.binary }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-macos --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfst-macos
          path: build-macos/**/lfst
